<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>가족 여행지도 이동</title></head>
<body><p>가족 여행지도로 이동합니다. <a id="continue" href="./index.html?city=nha_trang">여행지도 열기</a></p>
<script>
const next = new URL("./index.html", location.href);
next.search = location.search;
next.searchParams.set('city', "nha_trang");
next.hash = location.hash;
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
document.getElementById('continue').href = next.href;
location.replace(next.href);
</script></body></html>
